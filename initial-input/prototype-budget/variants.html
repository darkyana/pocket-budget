<!DOCTYPE html>
<!--
  PROTOTYPE — 一次性原型，不属于正式产品，用完即弃。
  问题：手机上"每天看一眼额度 / 每周对齐一次"的分类预算界面应该长什么样？
  形态：三个结构不同的变体，?variant=A|B|C 切换，底部悬浮切换条。
  数据：全部为假数据，纯内存，无持久化，不碰任何真实账本文件。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[原型] 分类预算 · 当下的钱</title>
<style>
  :root{
    --bg:#f4f2ee; --card:#fff; --ink:#1d1a16; --ink2:#6f675c;
    --line:#e6e1d8; --accent:#2f6f4f; --warn:#c25b3a; --over:#b3261e;
    --ok:#2f6f4f; --chip:#eee9df;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#dcd8d0;font-family:-apple-system,"PingFang SC",system-ui,sans-serif;color:var(--ink);
       display:flex;justify-content:center;min-height:100vh}
  .phone{width:100%;max-width:430px;background:var(--bg);min-height:100vh;position:relative;
         padding:calc(env(safe-area-inset-top) + 16px) 16px 120px}
  .proto-tag{position:absolute;top:6px;right:12px;font-size:10px;color:#a00;background:#ffe9e9;
             padding:2px 8px;border-radius:8px;z-index:5}
  h1{font-size:20px;margin-bottom:2px}
  .sub{font-size:12px;color:var(--ink2);margin-bottom:14px}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;
        box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .row{display:flex;justify-content:space-between;align-items:baseline}
  .muted{color:var(--ink2)} .small{font-size:12px} .big{font-size:30px;font-weight:700}
  .bar{height:8px;background:var(--chip);border-radius:4px;margin-top:8px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:4px}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--chip);margin-right:6px}
  .pill.ok{background:#e2efe7;color:var(--ok)} .pill.warn{background:#fbe8df;color:var(--warn)}
  .pill.over{background:#fadfdb;color:var(--over)}
  ul.cat{list-style:none} ul.cat li{padding:10px 0;border-bottom:1px solid var(--line)}
  ul.cat li:last-child{border-bottom:none}
  button{font:inherit;border:none;background:var(--ink);color:#fff;border-radius:12px;
         padding:10px 18px;font-weight:600}
  .floatbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:50;
            background:#111;color:#fff;border-radius:999px;display:flex;align-items:center;
            box-shadow:0 4px 16px rgba(0,0,0,.35);overflow:hidden}
  .floatbar button.fb{background:none;color:#fff;padding:10px 16px;font-size:18px}
  .floatbar .lb{font-size:12px;padding:0 10px;min-width:120px;text-align:center;color:#ffd97a}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hscroll{display:flex;gap:10px;overflow-x:auto;margin-top:10px;scroll-snap-type:x mandatory;
           -webkit-overflow-scrolling:touch;padding-bottom:4px}
  .hscroll::-webkit-scrollbar{display:none}
  .hscroll>.pg{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hscroll>.pg>.mini{background:var(--bg);border-radius:12px;padding:10px 12px}
  .ring{width:96px;height:96px;border-radius:50%;margin:8px auto;position:relative;
        background:conic-gradient(var(--accent) 0deg, var(--chip) 0deg)}
  .ring::after{content:"";position:absolute;inset:10px;background:var(--card);border-radius:50%}
  .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
          z-index:1;font-size:18px}
  .feed-item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .day-head{font-size:12px;color:var(--ink2);margin:14px 0 4px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="phone">
  <span class="proto-tag">PROTOTYPE · 假数据</span>
  <div id="app"></div>
</div>

<script>
window.onerror = function(msg, src, line, col){
  document.getElementById('app').innerHTML =
    '<pre style="color:#b3261e;white-space:pre-wrap;font-size:12px;padding-top:40px">JS错误：'+msg+
    '\n行 '+line+' 列 '+col+'</pre>';
};

/* ---------- 假数据：月度分类预算（2026-10） ---------- */
const today = "10月11日 周六";
const cats = [
  {name:"餐饮·外卖",   budget:900,  spent:612,  today:48,  base:"≈750/月"},
  {name:"餐饮·买菜",   budget:700,  spent:238,  today:32,  base:"≈650/月"},
  {name:"交通",        budget:250,  spent:96,   today:6,   base:"≈200/月"},
  {name:"日用品",      budget:300,  spent:274,  today:0,   base:"≈300/月"},
  {name:"娱乐",        budget:400,  spent:365,  today:88,  base:"≈350/月"},
  {name:"订阅",        budget:120,  spent:118,  today:0,   base:"≈120/月"},
  {name:"服饰",        budget:200,  spent:0,    today:0,   base:"≈150/月"},
];
const fixed = [{name:"物业费",amount:3000},{name:"水电网",amount:300}];
const month = {budget: cats.reduce((s,c)=>s+c.budget,0)+fixed.reduce((s,f)=>s+f.amount,0),
               spent: cats.reduce((s,c)=>s+c.spent,0)+fixed.reduce((s,f)=>s+f.amount,0)};
const dayBudget = 105; // (月预算 - 固定) / 31
const feed = [
  {day:"今天", items:[["外卖·午饭",32],["超市·水果",26],["咖啡",22]]},
  {day:"昨天", items:[["外卖·晚饭",45],["地铁",6],["视频会员续费",25]]},
  {day:"10月9日", items:[["买菜",58],["日用品·纸巾",39],["电影票",80]]},
];
function status(c){const r=c.spent/c.budget;return r>=1?"over":r>=.8?"warn":"ok";}
function stLabel(c){return {ok:"正常",warn:"接近上限",over:"已超支"}[status(c)];}
const monthDay = 11; // 今天是本月第几天
function pct(n){return Math.min(100,n*100);}
function money(n){return "¥"+n;}

/* ---------- 变体 A：今日额度（每天看的视角） ---------- */
function VariantA(){
  const todaySum = cats.reduce((s,c)=>s+c.today,0);
  return `
  <h1>今天</h1><div class="sub">${today} · 日均额度 ${money(dayBudget)}</div>
  <div class="card">
    <div class="row"><span class="muted small">今日已花</span>
      <span class="big" style="color:${todaySum>dayBudget?'var(--over)':'var(--ink)'}">${money(todaySum)}</span></div>
    <div class="bar"><i style="width:${pct(todaySum/dayBudget)}%;background:${todaySum>dayBudget?'var(--over)':'var(--accent)'}"></i></div>
    <div class="small muted" style="margin-top:6px">${todaySum>dayBudget
      ? `超出今日额度 ${money(todaySum-dayBudget)}，本月还有回旋余地`
      : `还剩 ${money(dayBudget-todaySum)} 可用`}</div>
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:4px"><b>分类剩余</b><span class="small muted">10月</span></div>
    <ul class="cat">${cats.map(c=>`
      <li>
        <div class="row"><span>${c.name}</span>
          <span class="small"><b>${money(Math.max(0,c.budget-c.spent))}</b>
          <span class="muted">/${money(c.budget)}</span></span></div>
        <div class="bar"><i style="width:${pct(c.spent/c.budget)}%;
          background:${status(c)==='over'?'var(--over)':status(c)==='warn'?'var(--warn)':'var(--accent)'}"></i></div>
        <div style="margin-top:4px"><span class="pill ${status(c)}">${stLabel(c)}</span>
          <span class="small muted">今天 ${c.today?money(c.today):"—"}</span></div>
      </li>`).join("")}
    </ul>
  </div>
  <div style="text-align:center"><button>＋ 记一笔（示意）</button></div>`;
}

/* ---------- 变体 B：仪表盘（月度总览视角） ---------- */
function VariantB(){
  const ratio = month.spent/month.budget, pace = month.spent/(dayBudget*monthDay);
  return `
  <h1>10月</h1><div class="sub">预算全景 · 第 ${monthDay} / 31 天</div>
  <div class="card" style="text-align:center">
    <div class="ring" style="background:conic-gradient(var(--accent) ${pct(ratio)*3.6}deg, var(--chip) 0)">
      <b>${Math.round(ratio*100)}%</b></div>
    <div class="small muted">已花 ${money(month.spent)} / 预算 ${money(month.budget)}</div>
    <div style="margin-top:8px"><span class="pill ${pace>1.1?'over':pace>0.9?'warn':'ok'}">
      ${pace>1.1?'花钱速度超前':pace>0.9?'速度略快':'进度正常'}</span>
      <span class="small muted">按此速度月底约 ${money(Math.round(month.spent/monthDay*31))}</span></div>
  </div>
  <div class="grid2">
    ${cats.map(c=>`
      <div class="card" style="margin:0">
        <div class="small muted">${c.name}</div>
        <div class="row" style="margin-top:2px"><b>${money(c.budget-c.spent)}</b>
          <span class="small ${status(c)}" style="color:var(--ink2)">${money(c.spent)}</span></div>
        <div class="bar"><i style="width:${pct(c.spent/c.budget)}%;
          background:${status(c)==='over'?'var(--over)':status(c)==='warn'?'var(--warn)':'var(--accent)'}"></i></div>
      </div>`).join("")}
  </div>
  <div class="card" style="margin-top:10px">
    <b class="small">固定支出</b>
    ${fixed.map(f=>`<div class="feed-item"><span>${f.name}</span><span>${money(f.amount)}</span></div>`).join("")}
  </div>`;
}

/* ---------- 变体 C：每周对齐（复盘视角） ---------- */
function VariantC(){
  const week = 486; // 本周至今假数据
  const weekBase = 260; // 消费基线（周）
  return `
  <h1>本周对齐</h1><div class="sub">10月6日 – 10月11日 · 每周日固定过一遍</div>
  <div class="card">
    <div class="row"><span class="muted small">本周弹性消费</span><b>${money(week)}</b></div>
    <div class="row"><span class="muted small">你的历史基线</span><span>${money(weekBase)}</span></div>
    <div class="bar"><i style="width:${pct(week/weekBase)}%;background:${week>weekBase?'var(--warn)':'var(--accent)'}"></i></div>
    <div class="small" style="margin-top:6px;color:${week>weekBase?'var(--warn)':'var(--ok)'}">
      ${week>weekBase?`超出基线 ${money(week-weekBase)}`:`低于基线 ${money(weekBase-week)}，存下来`}</div>
  </div>
  <div class="card">
    <b class="small">本周值得说的事</b>
    <div class="feed-item"><span>🎬 娱乐已用 91%（${money(365)}/${money(400)}）</span><span class="pill over">注意</span></div>
    <div class="feed-item"><span>🥡 外卖比基线快 20%</span><span class="pill warn">观察</span></div>
    <div class="feed-item"><span>👗 服饰 0 消费</span><span class="pill ok">好</span></div>
  </div>
  <div class="card">
    <b class="small">近三天流水</b>
    ${feed.map(d=>`<div class="day-head"><span>${d.day}</span><span>${money(d.items.reduce((s,i)=>s+i[1],0))}</span></div>`
      + d.items.map(i=>`<div class="feed-item"><span>${i[0]}</span><span>${money(i[1])}</span></div>`).join("")).join("")}
  </div>
  <div style="text-align:center"><button>本周对齐完成 ✓（示意）</button></div>`;
}

/* ---------- 变体 D：当日模版（rhythm + budget pool + commitment 三区块） ---------- */
const dayType = {name:"周末日"};   // 日型：周末 / 工作日 期望不同
const rhythmBuckets = { // 节律类别桶：按日型给期望，today=今天已花
  weekend:[{name:"三餐",expect:500,today:112},{name:"交通",expect:50,today:6},{name:"咖啡",expect:120,today:44},{name:"日用",expect:80,today:0},{name:"其他",expect:80,today:22}],
  weekday:[{name:"三餐",expect:50,today:0},{name:"交通",expect:10,today:0},{name:"咖啡",expect:20,today:0},{name:"日用",expect:30,today:0},{name:"其他",expect:20,today:0}],
};
const activeBuckets = dayType.name==="周末日" ? rhythmBuckets.weekend : rhythmBuckets.weekday;
const pools = [ // 预算池：月预算 → 摊到周；本周为第 2 周
  {name:"购物",   month:800, weekAllow:200, weekSpent:145, mSpent:340},
  {name:"学习",   month:300, weekAllow:75,  weekSpent:20,  mSpent:60},
  {name:"娱乐",   month:400, weekAllow:100, weekSpent:120, mSpent:365},
];
const commitments = [ // 义务：月内状态，不占今日额度
  {name:"家政服务", amount:2000, paid:true},
  {name:"宠物粮",   amount:400,  paid:false},
  {name:"物业费",   amount:3000, paid:true},
];
function toast(msg){
  let t=document.getElementById("proto-toast");
  t.textContent=msg; t.style.display="block";
  clearTimeout(toast._h); toast._h=setTimeout(()=>t.style.display="none",1800);
}
function addBucket(name){ toast("＋记一笔 → 节律·"+name+"（示意）"); }
function addPool(name){ toast("＋一笔收支 → 预算池·"+name+"（示意）"); }

function VariantD(){
  const rhythmTotal = activeBuckets.reduce((s,b)=>s+b.today,0);
  const expectTotal = activeBuckets.reduce((s,b)=>s+b.expect,0);
  const sorted = [...pools].sort((a,b)=>(b.weekAllow-b.weekSpent)-(a.weekAllow-a.weekSpent));
  const visible = sorted.filter(p=>p.weekAllow-p.weekSpent>0); // 超支的不再展示
  const unpaid = commitments.filter(c=>!c.paid);
  return `
  <h1>今日模版</h1><div class="sub">${today} · 日型：${dayType.name}</div>

  <div class="card">
    <div class="row"><b>🥣 节律</b>
      <span class="small"><b>${money(rhythmTotal)}</b> <span class="muted">/ 期望 ${money(expectTotal)}</span>
      <span style="color:${rhythmTotal>expectTotal?'var(--over)':'var(--ok)'}">${rhythmTotal>expectTotal?"超 "+money(rhythmTotal-expectTotal):"剩 "+money(expectTotal-rhythmTotal)}</span></span></div>
    <div class="hscroll">
      ${Array.from({length:Math.ceil(activeBuckets.length/4)},(_,pg)=>`
      <div class="pg">
        ${activeBuckets.slice(pg*4,pg*4+4).map(b=>{
        const left=b.expect-b.today;
        return `<div class="mini" onclick="addBucket('${b.name}')">
        <div class="small muted">${b.name}</div>
        <div class="row" style="margin-top:2px"><b style="font-size:17px;${left<0?'color:var(--over)':''}">${left>=0?money(left):"超 "+money(-left)}</b>
          <span class="small muted">${money(b.today)}</span></div>
        <div class="bar"><i style="width:${pct(b.today/b.expect)}%;
          background:${left<0?'var(--over)':left<b.expect*.2?'var(--warn)':'var(--accent)'}"></i></div>
      </div>`;}).join("")}
      </div>`).join("")}
    </div>
    <div class="small muted" style="margin-top:8px">${activeBuckets.length>4?"左右滑动看下一页（共 "+Math.ceil(activeBuckets.length/4)+" 页）· 点卡片记一笔":"点卡片记一笔"}</div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:6px"><b>🫙 预算池</b><span class="small muted">还能花</span></div>
    ${visible.map(p=>{
      const proj = p.mSpent / (monthDay/31);
      const left = p.weekAllow-p.weekSpent;
      return `<div onclick="addPool('${p.name}')" style="padding:8px 0;border-bottom:1px solid var(--line)">
      <div class="row"><span>${p.name}</span>
        <span class="small"><b style="${left<0?'color:var(--over)':''}">${left>=0?money(left):"超支 "+money(-left)}</b>
        <span class="muted">/ 本周 ${money(p.weekAllow)}</span></span></div>
      <div class="bar"><i style="width:${pct(p.weekSpent/p.weekAllow)}%;
        background:${left<0?'var(--over)':left<p.weekAllow*.2?'var(--warn)':'var(--accent)'}"></i></div>
      <div class="small muted" style="margin-top:4px">月 ${money(p.mSpent)}/${money(p.month)} ·
        推算月底 <b style="color:${proj>p.month*1.05?'var(--over)':'var(--ok)'}">${money(Math.round(proj))}</b></div>
    </div>`;}).join("")}
    <div class="small muted" style="margin-top:8px">点池 → 记一笔收支</div>
  </div>

  <div style="padding:2px 6px 14px;font-size:12px;color:var(--ink2)">
    <div style="display:flex;justify-content:space-between;padding:3px 0">
      <span>📌 义务 · 本月</span><span>${unpaid.length?"未付 "+money(unpaid.reduce((s,c)=>s+c.amount,0)):"已结清 ✅"}</span></div>
    ${commitments.map(c=>`
      <div style="display:flex;justify-content:space-between;padding:3px 0;border-top:1px dashed var(--line)">
        <span>${c.paid?"✅":"⬜"} ${c.name}</span>
        <span style="${c.paid?'text-decoration:line-through':(c.amount?'color:var(--warn);font-weight:600':'')}">${money(c.amount)}</span>
      </div>`).join("")}
  </div>
  <div style="text-align:center"><button>＋ 记一笔 → 先选锚（示意）</button></div>
  <div id="proto-toast" style="display:none;position:fixed;bottom:84px;left:50%;transform:translateX(-50%);
    background:#111;color:#ffd97a;padding:8px 16px;border-radius:999px;font-size:13px;z-index:60">​</div>`;
}
VariantD._open = false;

/* ---------- 切换 ---------- */
const variants = {A:["今日额度",VariantA], B:["仪表盘",VariantB], C:["每周对齐",VariantC], D:["当日模版",VariantD]};
function render(){
  const v = new URLSearchParams(location.search).get("variant") || "A";
  const key = variants[v] ? v : "A";
  document.getElementById("app").innerHTML = variants[key][1]() + `
    <div class="floatbar">
      <button class="fb" onclick="cycle(-1)">‹</button>
      <span class="lb">${key} · ${variants[key][0]}</span>
      <button class="fb" onclick="cycle(1)">›</button>
    </div>`;
}
function cycle(d){
  const order = Object.keys(variants);
  const cur = new URLSearchParams(location.search).get("variant") || "A";
  const next = order[(order.indexOf(cur in variants?cur:"A") + d + order.length) % order.length];
  const u = new URL(location); u.searchParams.set("variant", next); location.replace(u);
}
document.addEventListener("keydown", e=>{
  if(/input|textarea/i.test(document.activeElement.tagName)) return;
  if(e.key==="ArrowLeft") cycle(-1);
  if(e.key==="ArrowRight") cycle(1);
});
render();
</script>
</body>
</html>
